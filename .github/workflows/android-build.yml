name: Android APK

# Builds an installable Android APK in the cloud, so no PC is needed.
# Run it from GitHub: Actions tab > "Android APK" > Run workflow.
# The APK shows up under Releases (tag android-<run number>) and as a run artifact.

on:
  workflow_dispatch:
  push:
    branches: [smb2-android]

permissions:
  contents: write

env:
  GODOT_VERSION: 4.5.0          # Godot 4.5 stable (the project is a 4.5 project)
  ANDROID_PLATFORM: android-35
  ANDROID_BUILD_TOOLS: 35.0.0
  ANDROID_NDK: 28.1.13356709
  PRESET: Android              # preset name in export_presets.cfg

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;${{ env.ANDROID_PLATFORM }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}
            build-tools;35.0.1
            cmake;3.10.2.4988404
            ndk;${{ env.ANDROID_NDK }}

      - name: Set up Godot + export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Tell Godot where Android tools are
        run: |
          mkdir -p ~/.config/godot
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          GVER=$(godot --version | cut -d. -f1-2)
          cat > ~/.config/godot/editor_settings-${GVER}.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${HOME}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          EOF
          cat ~/.config/godot/editor_settings-${GVER}.tres

      - name: Install missing Android template files (Godot library .aar)
        # android/build/libs is gitignored, so it is not in the repo. Extract the template
        # that ships with the export templates, but NEVER overwrite files the repo already has
        # (unzip -n), so the customised GodotApp.java and manifest stay as they are.
        run: |
          TPL=$(find "$HOME/.local/share/godot" "$HOME/.config" -name android_source.zip 2>/dev/null | head -1)
          echo "template zip: $TPL"
          test -n "$TPL"
          unzip -n -q "$TPL" -d android/build
          find android/build/libs -type f | head

      - name: Match Android build template to this Godot version
        # The repo's android/build was generated by 4.5.beta3; Godot refuses to export
        # if the version stamp differs from the editor that is exporting.
        run: |
          echo -n "$(godot --version | cut -d. -f1-3)" > android/.build_version
          cat android/.build_version; echo

      - name: Make Gradle wrapper executable
        # git did not keep the executable bit on android/build/gradlew
        run: chmod +x android/build/gradlew

      - name: Disable shader baking for CI
        # The shader baker needs a GPU, which headless CI does not have.
        run: sed -i 's/^shader_baker\/enabled=true/shader_baker\/enabled=false/' export_presets.cfg

      - name: Import project
        run: godot --headless --import || true

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --export-debug "$PRESET" "$PWD/build/SMB1R-android.apk"
          ls -la build

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SMB1R-android-apk
          path: build/SMB1R-android.apk

      - name: Publish release (direct APK download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Android build ${{ github.run_number }}
          prerelease: true
          files: build/SMB1R-android.apk
